<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de IMC - Calcula ya</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-link">← Volver al inicio</a>
    <h1>Calculadora de IMC (Índice de Masa Corporal)</h1>
    <p>Calcula tu estado nutricional estimado según tu peso y altura.</p>
    
    <div class="calculator-card">
      <label for="peso">Peso (kg):</label>
      <input type="number" id="peso" placeholder="Ej. 70">

      <label for="altura">Altura (cm):</label>
      <input type="number" id="altura" placeholder="Ej. 175">

      <button onclick="calcularIMC()">Calcular IMC</button>

      <div id="resultado" class="result-box"></div>
    </div>
  </div>

  <script>
    function calcularIMC() {
      const peso = parseFloat(document.getElementById('peso').value);
      const alturaCm = parseFloat(document.getElementById('altura').value);

      if (isNaN(peso) || isNaN(alturaCm) || peso <= 0 || alturaCm <= 0) {
        document.getElementById('resultado').innerText = "Por favor, introduce valores válidos.";
        return;
      }

      const alturaM = alturaCm / 100;
      const imc = peso / (alturaM * alturaM);
      let clasificacion = "";

      if (imc < 18.5) {
        clasificacion = "Bajo peso";
      } else if (imc < 25) {
        clasificacion = "Peso normal";
      } else if (imc < 30) {
        clasificacion = "Sobrepeso";
      } else {
        clasificacion = "Obesidad";
      }

      document.getElementById('resultado').innerHTML = 
        `<strong>Tu IMC:</strong> ${imc.toFixed(1)}<br>` +
        `<small>Clasificación: <strong>${clasificacion}</strong></small>`;
    }
  </script>
</body>
</html>
