<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de IVA | CALCULA YA</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><a class="logo" href="index.html">CALCULA <span>YA</span></a></header><main><section class="section"><p class="eyebrow">CALCULADORA</p><h1>IVA</h1><div class="card" style="max-width:520px;margin-top:30px"><label>Precio sin IVA (€)</label><input id="n" type="number" placeholder="100" style="margin:10px 0;padding:14px"><label>IVA (%)</label><input id="p" type="number" value="21" style="margin:10px 0;padding:14px"><button class="button" onclick="calc()">Calcular</button><h2 id="r"></h2></div></section></main><script>function calc(){const n=Number(document.getElementById('n').value),p=Number(document.getElementById('p').value);document.getElementById('r').textContent=Number.isFinite(n)&&Number.isFinite(p)?`Total: ${(n*(1+p/100)).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})} €`:'Introduce los valores.'}</script></body></html>
