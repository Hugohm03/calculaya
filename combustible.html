<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de combustible | CALCULA YA</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><a class="logo" href="index.html">CALCULA <span>YA</span></a></header><main><section class="section"><p class="eyebrow">CALCULADORA</p><h1>Combustible</h1><div class="card" style="max-width:520px;margin-top:30px"><label>Distancia (km)</label><input id="d" type="number" placeholder="300" style="margin:10px 0;padding:14px"><label>Consumo (L/100 km)</label><input id="c" type="number" placeholder="6" style="margin:10px 0;padding:14px"><label>Precio del combustible (€/L)</label><input id="p" type="number" placeholder="1.50" step="0.01" style="margin:10px 0;padding:14px"><button class="button" onclick="calc()">Calcular</button><h2 id="r"></h2></div></section></main><script>function calc(){const d=Number(document.getElementById('d').value),c=Number(document.getElementById('c').value),p=Number(document.getElementById('p').value);const litros=d*c/100;const coste=litros*p;document.getElementById('r').textContent=Number.isFinite(coste)?`Coste aproximado: ${coste.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})} €`:'Completa los valores.'}</script></body></html>
