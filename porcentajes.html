<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de porcentajes | CALCULA YA</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><a class="logo" href="index.html">CALCULA <span>YA</span></a></header><main><section class="section"><p class="eyebrow">CALCULADORA</p><h1>Porcentajes</h1><div class="card" style="max-width:520px;margin-top:30px"><label>¿Qué porcentaje quieres calcular?</label><input id="p" type="number" placeholder="Ej. 15" style="margin:10px 0;padding:14px"><label>¿De qué cantidad?</label><input id="n" type="number" placeholder="Ej. 300" style="margin:10px 0;padding:14px"><button class="button" onclick="calc()">Calcular</button><h2 id="r"></h2></div></section></main><script>function calc(){const p=Number(document.getElementById('p').value),n=Number(document.getElementById('n').value);document.getElementById('r').textContent=Number.isFinite(p)&&Number.isFinite(n)?`${(p*n/100).toLocaleString('es-ES',{maximumFractionDigits:2})} €`:'Introduce los dos valores.'}</script></body></html>
