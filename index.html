<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título y metadatos para Google y redes sociales -->
    <title>Calcula ya | Calculadoras online de impuestos, sueldos y porcentajes</title>
    <meta name="description" content="Haz números al instante y sin líos. Calcula ya reúne las calculadoras cotidianas que necesitas: impuestos, nóminas, porcentajes y consumo de combustible.">
    
    <meta property="og:title" content="Calcula ya | Herramientas de cálculo rápido">
    <meta property="og:description" content="Resuelve tus cuentas de impuestos, porcentajes, gasolina y sueldo en segundos.">
    <meta property="og:type" content="website">

    <!-- Enlace a tu hoja de estilos CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Calcula ya</h1>
        <p>Tu suite de calculadoras rápidas y herramientas online</p>
    </header>

    <main class="contenedor-principal">

        <!-- Calculadora 1: Porcentajes -->
        <section class="calculadora-card" id="porcentajes">
            <h2>Calculadora de Porcentajes</h2>
            <form>
                <label for="porcentaje">Porcentaje (%):</label>
                <input type="number" id="porcentaje" placeholder="Ej: 21">

                <label for="cantidad">De la cantidad:</label>
                <input type="number" id="cantidad" placeholder="Ej: 100">

                <button type="button" onclick="calcularPorcentaje()">Calcular</button>
            </form>
            <div class="resultado" id="resultado-porcentaje">Resultado: -</div>
        </section>

        <!-- Calculadora 2: Impuestos (IVA) -->
        <section class="calculadora-card" id="impuestos">
            <h2>Calculadora de Impuestos (IVA)</h2>
            <form>
                <label for="precio">Base imponible (€):</label>
                <input type="number" id="precio" placeholder="Ej: 50">

                <label for="tipo-iva">Tipo de IVA (%):</label>
                <input type="number" id="tipo-iva" value="21">

                <button type="button" onclick="calcularIVA()">Calcular Total</button>
            </form>
            <div class="resultado" id="resultado-iva">Resultado: -</div>
        </section>

        <!-- Calculadora 3: Consumo de Combustible -->
        <section class="calculadora-card" id="combustible">
            <h2>Consumo de Combustible</h2>
            <form>
                <label for="kilometros">Kilómetros recorridos:</label>
                <input type="number" id="kilometros" placeholder="Ej: 450">

                <label for="litros">Litros consumidos:</label>
                <input type="number" id="litros" placeholder="Ej: 30">

                <button type="button" onclick="calcularCombustible()">Calcular Consumo</button>
            </form>
            <div class="resultado" id="resultado-combustible">Resultado: -</div>
        </section>

        <!-- Calculadora 4: Sueldo Neto / Bruto -->
        <section class="calculadora-card" id="sueldo">
            <h2>Estimador de Sueldo Neto</h2>
            <form>
                <label for="sueldo-bruto">Sueldo Bruto Anual (€):</label>
                <input type="number" id="sueldo-bruto" placeholder="Ej: 24000">

                <label for="pagas">Número de pagas:</label>
                <select id="pagas">
                    <option value="12">12 pagas</option>
                    <option value="14">14 pagas</option>
                </select>

                <button type="button" onclick="calcularSueldo()">Calcular Estimación</button>
            </form>
            <div class="resultado" id="resultado-sueldo">Resultado: -</div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Calcula ya - Todos los derechos reservados</p>
    </footer>

</body>
</html>
